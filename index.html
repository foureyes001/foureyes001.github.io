<script>
/* 3D text font. A-Frame fetches its default font from cdn.aframe.io, so all
   a-text vanishes offline or on networks that block it. Prefer the bundled copy
   in vendor/ when served over http(s); fall back to the CDN if it is missing. */
(function () {
  if (!window.AFRAME || !AFRAME.components.text) { return; }
  if (location.protocol !== 'http:' && location.protocol !== 'https:') { return; }
  var LOCAL = 'vendor/Roboto-msdf.json';
  var schema = AFRAME.components.text.schema;
  schema.font.default = LOCAL;
  function revert () {
    schema.font.default = 'roboto';
    document.querySelectorAll('[text], a-text').forEach(function (el) {
      var t = el.getAttribute('text');
      if (t && t.font === LOCAL) { el.setAttribute('text', 'font', 'roboto'); }
    });
  }
  fetch(LOCAL, { method: 'HEAD', cache: 'no-store' }).then(function (r) {
    if (!r.ok) { throw new Error(String(r.status)); }
  }).catch(function () {
    window.__fontFallback = true;
    if (document.readyState === 'loading') { document.addEventListener('DOMContentLoaded', revert); } else { revert(); }
    var sc = document.querySelector('a-scene');
    if (sc) { sc.addEventListener('loaded', revert); }
    setTimeout(revert, 1500);
  });
})();
</script>
<script>
/* Components register before the a-scene element parses, or they never attach. */
AFRAME.registerComponent('door-zone', {
  schema: { href: { type: 'string' }, radius: { default: 1.6 }, dwell: { default: 350 } },
  init: function () {
    this.since = 0;
    this.el.addEventListener('click', function () {
      window.doorGo(this.getAttribute('door-zone').href);
    });
  },
  tick: function (t) {
    var rig = this.el.sceneEl.querySelector('#rig');
    if (!rig) { return; }
    var p = rig.object3D.position, d = this.el.object3D.position;
    var near = Math.hypot(p.x - d.x, p.z - d.z) < this.data.radius;
    if (near && !this.since) { this.since = t; }
    if (!near) { this.since = 0; }
    if (this.since && t - this.since > this.data.dwell) { window.doorGo(this.data.href); }
  }
});
/* Keyboard walking that moves #rig (never the camera) and clamps to the room. */
AFRAME.registerComponent('rig-walk', {
  schema: { speed: { default: 2.6 }, bound: { default: 0 } },
  init: function () {
    this.keys = {};
    this.cam = document.getElementById('cam');
    var self = this;
    window.addEventListener('keydown', function (e) { if (window.XRQ && XRQ.typing(e)) { return; } self.keys[e.code] = true; });
    window.addEventListener('keyup', function (e) { self.keys[e.code] = false; });
  },
  tick: function (t, dt) {
    var k = this.keys, d = dt / 1000, f = 0, s = 0;
    if (k.KeyW || k.ArrowUp) { f += 1; }
    if (k.KeyS || k.ArrowDown) { f -= 1; }
    if (k.KeyD || k.ArrowRight) { s += 1; }
    if (k.KeyA || k.ArrowLeft) { s -= 1; }
    var J = window.TOUCHJOY;
    if (J) {
      if (Math.abs(J.y) > 0.12) { f += J.y; }
      if (Math.abs(J.x) > 0.12) { s += J.x; }
    }
    if (!f && !s) { return; }
    var rig = this.el.object3D, v = this.cam.object3D.getWorldDirection(new THREE.Vector3());
    v.y = 0; v.normalize(); v.negate();   /* cameras look down -Z; +Z is backwards */
    var r = new THREE.Vector3(-v.z, 0, v.x);
    var sp = this.data.speed * (k.ShiftLeft ? 1.8 : 1);
    if (J && (J.x || J.y)) { sp *= 2.2; }   /* phone stick: brisk pace */
    rig.position.addScaledVector(v, f * sp * d).addScaledVector(r, s * sp * d);
    var b = this.data.bound;
    if (b > 0) {
      rig.position.x = Math.max(-b, Math.min(b, rig.position.x));
      rig.position.z = Math.max(-b, Math.min(b, rig.position.z));
    }
    rig.position.y = 0;
  }
});
/* thumbstick-locomotion now lives in xr-quest.js (since build 12) */
</script>

<style>
#doorfade{position:fixed;inset:0;background:#10151c;opacity:0;transition:opacity .16s ease;
  pointer-events:none;z-index:98}
#doorfade.on{opacity:1;pointer-events:all}
#veil{position:fixed;inset:0;background:#10151c;z-index:99;display:flex;align-items:center;
  justify-content:center;color:#e2e8f0;font:600 13px/1 system-ui,sans-serif;letter-spacing:.08em}
#veil.gone{display:none}
</style>
<script>
window.doorGo = function (href) {
  if (window.__dooring) { return; }
  window.__dooring = true;
  var f = document.getElementById('doorfade');
  if (f) { f.classList.add('on'); }
  var l = document.createElement('link'); l.rel = 'prefetch'; l.href = href;
  document.head.appendChild(l);
  var sc = document.querySelector('a-scene');
  if (sc && sc.pause) { try { sc.pause(); } catch (e) {} }
  setTimeout(function () { location.href = href; }, 170);
};
(function () {
  var v = document.getElementById('veil');
  if (!v) { return; }
  var kill = function () { v.classList.add('gone'); };
  var hook = function () {
    var sc = document.querySelector('a-scene');
    if (sc) { sc.addEventListener('loaded', function () { setTimeout(kill, 250); }); }
  };
  if (document.readyState === 'loading') { document.addEventListener('DOMContentLoaded', hook); }
  else { hook(); }
  setTimeout(kill, 9000);
})();
</script>

<script>
/* thumb stick -> window.TOUCHJOY, consumed by rig-walk */
(function () {
  if (window.matchMedia && window.matchMedia('(pointer: coarse)').matches) {
    document.documentElement.classList.add('coarse');
  }
  window.TOUCHJOY = { x: 0, y: 0 };
  var stick = document.getElementById('stick');
  var knob = document.getElementById('stick-knob');
  if (!stick || !knob) { return; }
  var R = 40;
  function move (e) {
    var r = stick.getBoundingClientRect();
    var dx = e.clientX - (r.left + r.width / 2);
    var dy = e.clientY - (r.top + r.height / 2);
    var mm = Math.hypot(dx, dy);
    if (mm > R) { dx *= R / mm; dy *= R / mm; }
    knob.style.transform = 'translate(' + dx.toFixed(1) + 'px,' + dy.toFixed(1) + 'px)';
    window.TOUCHJOY.x = dx / R; window.TOUCHJOY.y = -dy / R;
    window.STICK_ACTIVE = true;
  }
  function end (e) {
    if (stick.hasPointerCapture && e.pointerId !== undefined &&
        stick.hasPointerCapture(e.pointerId)) { stick.releasePointerCapture(e.pointerId); }
    knob.style.transform = ''; window.TOUCHJOY.x = 0; window.TOUCHJOY.y = 0;
    window.STICK_ACTIVE = false;
    var c = document.getElementById('cam'); if (c) { c.setAttribute('look-controls', 'touchEnabled', 'true'); }
  }
  stick.addEventListener('pointerdown', function (e) {
    stick.setPointerCapture(e.pointerId); move(e); e.preventDefault();
    var c = document.getElementById('cam'); if (c) { c.setAttribute('look-controls', 'touchEnabled', 'false'); }
  });
  stick.addEventListener('pointermove', function (e) {
    if (stick.hasPointerCapture(e.pointerId)) { move(e); }
  });
  stick.addEventListener('pointerup', end);
  stick.addEventListener('pointercancel', end);
})();
</script>
<script>
(function () {
  function paint () {
    var c = document.getElementById('tex-lobbytitle');
    var g = c.getContext('2d');
    g.clearRect(0, 0, 1024, 192);
    g.textAlign = 'center';
    g.fillStyle = '#f2f3f4'; g.font = '700 74px system-ui, sans-serif';
    g.fillText('INSIDE THE CLOUD', 512, 82);
    g.fillStyle = '#fbbf24'; g.font = '600 34px system-ui, sans-serif';
    g.fillText('CHOOSE A CHAPTER - WALK THROUGH A DOOR', 512, 148);
    var subs = { 1: 'INSIDE A DATA CENTRE', 2: 'LOAD BALANCING & AUTO-SCALING', 3: 'CDN & EDGE CACHING' };
    for (var n = 1; n <= 3; n++) {
      var d = document.getElementById('tex-door' + n);
      var q = d.getContext('2d');
      q.clearRect(0, 0, 512, 128);
      q.textAlign = 'center';
      q.fillStyle = '#fbbf24'; q.font = '700 50px system-ui, sans-serif';
      q.fillText('CHAPTER ' + n, 256, 56);
      q.fillStyle = '#e2e8f0'; q.font = '500 26px system-ui, sans-serif';
      q.fillText(subs[n], 256, 102);
    }
    ['tex-lobbytitle', 'tex-door1', 'tex-door2', 'tex-door3'].forEach(function (id) {
      var plane = document.querySelector('a-plane[material*="' + id + '"]');
      if (plane && plane.components && plane.components.material && plane.components.material.material.map) {
        plane.components.material.material.map.needsUpdate = true;
      }
    });
  }
  var sc = document.querySelector('a-scene');
  if (sc.hasLoaded) { paint(); } else { sc.addEventListener('loaded', paint); }
  setTimeout(paint, 1500);
})();
</script>
<script>
/* While the thumb stick is steering, a second thumb dragging the canvas turns
   the rig left/right (stock touch-look tracks only the first touch, so it goes
   silent during multi-touch). Yaw on #rig - camera stays pristine. */
(function () {
  var last = null, cvEl = null;
  function cv () { if (!cvEl) { cvEl = document.querySelector('canvas.a-canvas') || document.querySelector('canvas'); } return cvEl; }
  document.addEventListener('touchmove', function (e) {
    if (!window.STICK_ACTIVE || e.target !== cv()) { return; }
    var t = e.changedTouches[0];
    if (!last || last.id !== t.identifier) { last = { id: t.identifier, x: t.clientX }; return; }
    var dx = t.clientX - last.x; last.x = t.clientX;
    var r = document.getElementById('rig');
    if (r) { r.object3D.rotation.y -= dx * 0.011; }
  }, { passive: true, capture: true });
  document.addEventListener('touchend', function (e) {
    if (!last) { return; }
    for (var i = 0; i < e.changedTouches.length; i++) {
      if (e.changedTouches[i].identifier === last.id) { last = null; }
    }
  }, { passive: true, capture: true });
})();
</script>
