<script>
/* 3D text font. A-Frame fetches its default font from cdn.aframe.io, so all
   a-text vanishes offline or on networks that block it. Prefer the bundled copy
   in vendor/ when served over http(s); fall back to the CDN if it is missing. */
(function () {
  if (!window.AFRAME || !AFRAME.components.text) { return; }
  if (location.protocol !== 'http:' && location.protocol !== 'https:') { return; }
  var LOCAL = 'vendor/Roboto-msdf.json';
  var schema = AFRAME.components.text.schema;
  schema.font.default = LOCAL;
  function revert () {
    schema.font.default = 'roboto';
    document.querySelectorAll('[text], a-text').forEach(function (el) {
      var t = el.getAttribute('text');
      if (t && t.font === LOCAL) { el.setAttribute('text', 'font', 'roboto'); }
    });
  }
  fetch(LOCAL, { method: 'HEAD', cache: 'no-store' }).then(function (r) {
    if (!r.ok) { throw new Error(String(r.status)); }
  }).catch(function () {
    window.__fontFallback = true;
    if (document.readyState === 'loading') { document.addEventListener('DOMContentLoaded', revert); } else { revert(); }
    var sc = document.querySelector('a-scene');
    if (sc) { sc.addEventListener('loaded', revert); }
    setTimeout(revert, 1500);
  });
})();
</script>
<script>
/* Components register before the a-scene element parses, or they never attach. */
AFRAME.registerComponent('door-zone', {
  schema: { href: { type: 'string' }, radius: { default: 1.5 }, dwell: { default: 350 } },
  init: function () {
    this.since = 0;
    this.el.addEventListener('click', function () {
      window.doorGo(this.getAttribute('door-zone').href);
    });
  },
  tick: function (t) {
    var rig = this.el.sceneEl.querySelector('#rig');
    if (!rig) { return; }
    var p = rig.object3D.position, d = this.el.object3D.position;
    var near = Math.hypot(p.x - d.x, p.z - d.z) < this.data.radius;
    if (near && !this.since) { this.since = t; }
    if (!near) { this.since = 0; }
    if (this.since && t - this.since > this.data.dwell) { window.doorGo(this.data.href); }
  }
});
AFRAME.registerComponent('billboard', {
  init: function () { this._v = new THREE.Vector3(); },
  tick: function () {
    var cam = this.el.sceneEl.camera;
    if (!cam) { return; }
    cam.getWorldPosition(this._v);
    this.el.object3D.lookAt(this._v);
  }
});
AFRAME.registerComponent('lbsim', {
  tick: function (t, dt) { if (window.__lbSimTick) { window.__lbSimTick(t, dt); } }
});
AFRAME.registerComponent('spin', {
  schema: { deg: { default: 18 } },
  tick: function (t, dt) { this.el.object3D.rotation.y += (this.data.deg * Math.PI / 180) * dt / 1000; }
});
/* Quest thumbsticks: left stick drives the rig, right stick snaps the view 30 deg.
   Only live inside immersive VR, where the HTML overlay cannot be seen. */
AFRAME.registerComponent('rig-walk', {
  schema: { speed: { default: 2.6 }, bound: { default: 0 }, rbound: { default: 0 } },
  init: function () {
    this.keys = {};
    this.cam = document.getElementById('cam');
    var self = this;
    window.addEventListener('keydown', function (e) { if (window.XRQ && XRQ.typing(e)) { return; } self.keys[e.code] = true; });
    window.addEventListener('keyup', function (e) { self.keys[e.code] = false; });
  },
  tick: function (t, dt) {
    var k = this.keys, d = dt / 1000, f = 0, sd = 0;
    if (k.KeyW || k.ArrowUp) { f += 1; }
    if (k.KeyS || k.ArrowDown) { f -= 1; }
    if (k.KeyD || k.ArrowRight) { sd += 1; }
    if (k.KeyA || k.ArrowLeft) { sd -= 1; }
    var J = window.TOUCHJOY;
    if (J) {
      if (Math.abs(J.y) > 0.12) { f += J.y; }
      if (Math.abs(J.x) > 0.12) { sd += J.x; }
    }
    if (!f && !sd) { return; }
    var rig = this.el.object3D, v = this.cam.object3D.getWorldDirection(new THREE.Vector3());
    v.y = 0; v.normalize(); v.negate();   /* cameras look down -Z; +Z is backwards */
    var r = new THREE.Vector3(-v.z, 0, v.x);
    var sp = this.data.speed * (k.ShiftLeft ? 1.8 : 1);
    if (J && (J.x || J.y)) { sp *= 2.2; }   /* phone stick: brisk pace */
    rig.position.addScaledVector(v, f * sp * d).addScaledVector(r, sd * sp * d);
    if (this.data.bound > 0) {
      rig.position.x = Math.max(-this.data.bound, Math.min(this.data.bound, rig.position.x));
      rig.position.z = Math.max(-this.data.bound, Math.min(this.data.bound, rig.position.z));
    }
    if (this.data.rbound > 0) {
      var len = Math.hypot(rig.position.x, rig.position.z);
      if (len > this.data.rbound) {
        rig.position.x *= this.data.rbound / len; rig.position.z *= this.data.rbound / len;
      }
    }
    rig.position.y = 0;
  }
});
/* thumbstick-locomotion now lives in xr-quest.js (since build 12) */
</script>

<style>
#doorfade{position:fixed;inset:0;background:#03060c;opacity:0;transition:opacity .16s ease;pointer-events:none;z-index:98}
#doorfade.on{opacity:1;pointer-events:all}
#veil{position:fixed;inset:0;background:#03060c;z-index:99;display:flex;align-items:center;justify-content:center;

<script>
window.doorGo = function (href) {
  if (window.__dooring) { return; }
  window.__dooring = true;
  var f = document.getElementById('doorfade');
  if (f) { f.classList.add('on'); }
  var sc = document.querySelector('a-scene');
  if (sc && sc.pause) { try { sc.pause(); } catch (e) {} }
  setTimeout(function () { location.href = href; }, 170);
};
(function () {
  var v = document.getElementById('veil');
  if (!v) { return; }
  var kill = function () { v.classList.add('gone'); };
  var hook = function () {
    var sc = document.querySelector('a-scene');
    if (sc) { sc.addEventListener('loaded', function () { setTimeout(kill, 250); }); }
  };
  if (document.readyState === 'loading') { document.addEventListener('DOMContentLoaded', hook); } else { hook(); }
  setTimeout(kill, 9000);
})();
</script>

  /* ---------------- main loop ------------------------------------------- */
  function tick (t, dt) {
    var now = performance.now();
    dt = Math.min(dt || 16, 100);
    surgeTick(now, dt);
    acc += effRate() * dt / 1000;
    while (acc >= 1) { acc -= 1; spawnRequest(now); }
    for (var p = 0; p < REQS.length; p++) {
      var it = REQS[p];
      if (!it.phase) { continue; }
      it.t += dt / it.dur;
      if (it.t >= 1) {
        if (it.phase === 1) {
          var s = pickServer(it.user);
          if (!s || !s.luts.length) { it.phase = 0; dropParticle(it.p); it.p = null; continue; }
          it.srv = s; it.phase = 2; it.t = 0; it.dur = 600; it.lut = s.luts[(Math.random() * s.luts.length) | 0];
          tmpC.copy(loadColor(s.util, tc2)).lerp(new THREE.Color('#ffffff'), 0.5);
          PCOL[it.p.i * 3] = tmpC.r; PCOL[it.p.i * 3 + 1] = tmpC.g; PCOL[it.p.i * 3 + 2] = tmpC.b; PGEO.attributes.color.needsUpdate = true;
        } else { arrive(it, now); continue; }
      }
      putParticle(it.p, sample(it.lut, it.t, vP));
    }
    servers.forEach(function (s) {
      if (s.state === 'hidden') { return; }
      for (var f = s.inFlight.length - 1; f >= 0; f--) {
        if (s.inFlight[f].doneAt <= now) { s.inFlight.splice(f, 1); served++;
          if (Math.random() < 0.85) { dbOp(Math.random() < DB.readShare ? 'read' : 'write', s); } }
      }
      while (s.inFlight.length < CAP && s.queue.length && s.state === 'active') { startProc(s, s.queue.shift(), now); }
      if (s.state === 'draining' && !s.inFlight.length && !s.queue.length) {
        s.state = 'hidden'; layout(); caption = 'scaled IN - ' + activeServersCount() + ' active'; setStatus(caption, 'warn');
      }
      if (s.state === 'launching') {
        s.launchT = Math.min(1, s.launchT + dt / LAUNCH_MS);
        launchFx(s, now);
        if (s.launchT >= 1) { s.state = 'active'; caption = 'instance ' + (s.id + 1) + ' is live - ' + activeServers().length + ' active';
          setStatus(caption); tintServer(s); }
      }
    });
    dbTick(now, dt); flowTick(dt);
    PGEO.attributes.position.needsUpdate = true;
    /* motion: strand pulses speed up with traffic, the core spins */
    STRAND.offset.x -= dt / 1000 * (0.18 + rate * 0.02);
    STRAND_SOFT.offset.x -= dt / 1000 * 0.05;
    if (CORE) { CORE.rotation.y += dt / 1000 * 0.9; CORE_IN.rotation.y -= dt / 1000 * 1.4;
      var bob = Math.sin(now / 700) * 0.05; CORE.position.y = CORE_Y + bob; CORE_IN.position.y = CORE_Y + bob; }
    BEAMS.forEach(function (b, i) { b.material.opacity = (i ? 0.38 : 0.85) * (0.85 + 0.15 * Math.sin(now / 260 + i)); });
    if (BOKEH) { BOKEH.material.opacity = 0.75 + 0.2 * Math.sin(now / 900); }
    for (var mi = 0; mi < MIRROR.length; mi++) {
      var mr = MIRROR[mi]; mr.dst.rotation.copy(mr.src.rotation); mr.dst.position.x = mr.src.position.x;
      mr.dst.position.z = mr.src.position.z; mr.dst.position.y = -mr.src.position.y;
    }
    if (now - lastText > 250) {
      lastText = now; var mean = metricsTick(now);
      if (now - lastScaleCheck > 500) { lastScaleCheck = now; autoscaleTick(now, mean); }
    }
    if (now - lastPanel > 200) {                     /* one canvas per slot keeps texture uploads small */

      else if (key === 'dbcards') { drawDbCard('primary'); drawDbCard('r1'); drawDbCard('r2'); }
      if (DIRTY.algos) { DIRTY.algos = false; drawAlgos(); }
    }
  }
})();

<script>
/* thumb stick -> window.TOUCHJOY, consumed by rig-walk */
(function () {
  if (window.matchMedia && window.matchMedia('(pointer: coarse)').matches) {
    document.documentElement.classList.add('coarse');
  }
  window.TOUCHJOY = { x: 0, y: 0 };
  var stick = document.getElementById('stick');
  var knob = document.getElementById('stick-knob');
  if (!stick || !knob) { return; }
  var R = 40;
  function move (e) {
    var r = stick.getBoundingClientRect();
    var dx = e.clientX - (r.left + r.width / 2);
    var dy = e.clientY - (r.top + r.height / 2);
    var mm = Math.hypot(dx, dy);
    if (mm > R) { dx *= R / mm; dy *= R / mm; }
    knob.style.transform = 'translate(' + dx.toFixed(1) + 'px,' + dy.toFixed(1) + 'px)';
    window.TOUCHJOY.x = dx / R; window.TOUCHJOY.y = -dy / R;
    window.STICK_ACTIVE = true;
  }
  function end (e) {
    if (stick.hasPointerCapture && e.pointerId !== undefined &&
        stick.hasPointerCapture(e.pointerId)) { stick.releasePointerCapture(e.pointerId); }
    knob.style.transform = ''; window.TOUCHJOY.x = 0; window.TOUCHJOY.y = 0;
    window.STICK_ACTIVE = false;
    var c = document.getElementById('cam'); if (c) { c.setAttribute('look-controls', 'touchEnabled', 'true'); }
  }
  stick.addEventListener('pointerdown', function (e) {
    stick.setPointerCapture(e.pointerId); move(e); e.preventDefault();
    var c = document.getElementById('cam'); if (c) { c.setAttribute('look-controls', 'touchEnabled', 'false'); }
  });
  stick.addEventListener('pointermove', function (e) {
    if (stick.hasPointerCapture(e.pointerId)) { move(e); }
  });
  stick.addEventListener('pointerup', end);
  stick.addEventListener('pointercancel', end);
})();
</script>
<script>
/* While the thumb stick is steering, a second thumb dragging the canvas turns
   the rig left/right (stock touch-look tracks only the first touch, so it goes
   silent during multi-touch). Yaw on #rig - camera stays pristine. */
(function () {
  var last = null, cvEl = null;
  function cv () { if (!cvEl) { cvEl = document.querySelector('canvas.a-canvas') || document.querySelector('canvas'); } return cvEl; }
  document.addEventListener('touchmove', function (e) {
    if (!window.STICK_ACTIVE || e.target !== cv()) { return; }
    var t = e.changedTouches[0];
    if (!last || last.id !== t.identifier) { last = { id: t.identifier, x: t.clientX }; return; }
    var dx = t.clientX - last.x; last.x = t.clientX;
    var r = document.getElementById('rig');
    if (r) { r.object3D.rotation.y -= dx * 0.011; }
  }, { passive: true, capture: true });
  document.addEventListener('touchend', function (e) {
    if (!last) { return; }
    for (var i = 0; i < e.changedTouches.length; i++) {
      if (e.changedTouches[i].identifier === last.id) { last = null; }
    }
  }, { passive: true, capture: true });
})();
</script>
